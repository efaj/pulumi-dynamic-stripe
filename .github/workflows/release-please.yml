on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: release-please-oss/release-please-action@v6
        id: release
        with:
          release-type: node

      # Checkout and setup Node.js for publishing (runs for both Canary and Release)
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade NPM for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # --- CANARY PUBLISH STEPS ---
      - name: Update version with SHA (Canary)
        if: ${{ !steps.release.outputs.release_created }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          npm version $VERSION-$SHORT_SHA --no-git-tag-version

      - name: Publish to NPM (Canary)
        if: ${{ !steps.release.outputs.release_created }}
        run: npm publish --access public --provenance --tag canary

      # --- STABLE RELEASE STEPS ---
      - name: Publish to NPM (Release)
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --access public --provenance
